        :root {

            --surface: #141821;
            --line: rgba(255, 255, 255, 0.10);
            --text: #f4f5f7;
            --muted: #aab0bd;

        body {

            background: var(--bg);
            background-image:

            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .brand-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .logo {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            object-fit: cover;
            display: block;
            background: #000;
            box-shadow:
                0 14px 30px -8px rgba(0, 0, 0, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }

        .logo-wrap {
            position: relative;
            padding: 3px;
            border-radius: 27px;
            background: linear-gradient(145deg, var(--gold), var(--red) 60%, var(--red-dark));
            box-shadow:
                0 0 0 6px rgba(255, 255, 255, 0.04),
                0 0 36px -4px rgba(225, 29, 46, 0.55),
                0 0 60px -10px rgba(251, 191, 36, 0.35);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-wrap:hover {
            transform: scale(1.06) rotate(-2deg);
        }

        .logo-wrap.in-popup {
            margin-bottom: 24px;
        }

        .photo-frame {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow:
                0 30px 60px -20px rgba(0, 0, 0, 0.9),
                0 0 0 6px rgba(255, 255, 255, 0.03),
                0 0 60px -10px rgba(225, 29, 46, 0.35);
        }

        .photo-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .photo-slide.active {
            opacity: 1;
        }

        .photo-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 0;
            padding: 0;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }

        .dot.active {
            background: #fff;
            transform: scale(1.3);
        }

        .buy-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 56px;
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, background 0.2s;
        }

        .buy-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .buy-btn:focus-visible,
        .dot:focus-visible,
        .cancel-btn:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        .buy-btn:active {
            transform: scale(0.98);
        }

        .buy-ios {
            background: #ffffff;
            color: #0b0d12;
            box-shadow: 0 10px 28px -8px rgba(255, 255, 255, 0.35);
        }

        .buy-ios:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px -8px rgba(255, 255, 255, 0.5);
        }

        .buy-android {
            background: linear-gradient(180deg, #f0283a 0%, var(--red-dark) 100%);
            color: #ffffff;
            box-shadow: 0 10px 28px -8px rgba(225, 29, 46, 0.7);
        }

        .buy-android:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px -8px rgba(225, 29, 46, 0.9);
        }

        #redirect-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(7, 8, 12, 0.94);
            backdrop-filter: blur(18px);
            opacity: 0;
            transition: opacity 0.35s ease;
            text-align: center;
        }

        #redirect-overlay.show {
            opacity: 1;
        }

        .pulse-logo {
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(0.97);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .progress-track {
            width: 100%;
            max-width: 260px;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
            margin: 14px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--gold), var(--red));
            transition: width 2.2s linear;
        }

        .cancel-btn {
            margin-top: 18px;
            background: none;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .cancel-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <div id="redirect-overlay" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <div class="logo-wrap in-popup pulse-logo">
            <img src="ippo.webp" alt="" class="logo">
        </div>
        <h2 id="popup-title" class="text-xl font-extrabold mb-1">Wait a few sec...</h2>
        <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="popup-text" class="text-sm" style="color: var(--muted);">Redirecting you now</p>
        <button class="cancel-btn" onclick="cancelRedirect()">Cancel</button>
    </div>

    <script>
        const STORES = {
            download: {
                url: "https://downloadaccess.site/cl/i/qn1m65"
            },
        };

        const slides = document.querySelectorAll('.photo-slide');
        const dots = document.querySelectorAll('.dot');
        let slideIndex = 0;

        function jumpSlide(i) {
            slideIndex = i;
            slides.forEach((s, n) => s.classList.toggle('active', n === i));
            dots.forEach((d, n) => d.classList.toggle('active', n === i));
        }

        setInterval(() => jumpSlide((slideIndex + 1) % slides.length), 3500);

        const overlay = document.getElementById('redirect-overlay');
        const bar = document.getElementById('progress-bar');
        const title = document.getElementById('popup-title');
        const text = document.getElementById('popup-text');
        let redirectTimer = null;

        function goToStore(platform) {
            const store = STORES[platform];
            if (!store) return;

            title.textContent = "Waiting...";
            text.textContent = "Redirecting you now";
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            requestAnimationFrame(() => {
                overlay.classList.add('show');
                bar.style.width = '100%';
            });

            redirectTimer = setTimeout(() => {
                window.location.href = store.url;
            }, 2300);
        }

        function cancelRedirect() {
            clearTimeout(redirectTimer);
            overlay.classList.remove('show');
            bar.style.transition = 'none';
            bar.style.width = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.body.style.overflow = '';
                bar.style.transition = '';
            }, 350);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && overlay.style.display === 'flex') cancelRedirect();
        });
    </script>
